[project]
name = "falconverifier"
version = "0.1.0"
description = "Lean 4 formal verification loop that teaches Falcon LLMs to reason correctly"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
falconverifier = "falconverifier.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["falconverifier*"]

[tool.setuptools.package-data]
falconverifier = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lean: requires Lean toolchain", "live: requires live Falcon API"]
