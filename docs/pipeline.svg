<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" width="1240" height="420" font-family="Inter, system-ui, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f2247"/></marker></defs>
<text x="30" y="34" font-family="Cormorant Garamond, Georgia, serif" font-size="26" font-weight="600" fill="#0f2247">How a Falcon answer becomes a kernel-checked claim</text>
<text x="30" y="54" font-size="12" fill="#5b6b8c" letter-spacing="2">FALCON SAYS IT · LEAN 4 DECIDES IT · FALCON LEARNS FROM IT</text>
<rect x="30.0" y="70" width="175.0" height="150" rx="6" fill="#fff" stroke="#0f2247" stroke-width="1"/>
<text x="44.0" y="100" font-family="Cormorant Garamond, Georgia, serif" font-size="21" font-weight="600" fill="#0f2247">Falcon answers</text>
<text x="44.0" y="120" font-size="11" fill="#5b6b8c" letter-spacing="1.2">STUDENT 3B / 7B</text>
<text x="44.0" y="170" font-size="13" fill="#0f2247">Arabic or English,</text>
<text x="44.0" y="187" font-size="13" fill="#0f2247">step-by-step CoT</text>
<line x1="207.0" y1="145.0" x2="229.0" y2="145.0" stroke="#0f2247" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="231.0" y="70" width="175.0" height="150" rx="6" fill="#fff" stroke="#0f2247" stroke-width="1"/>
<text x="245.0" y="100" font-family="Cormorant Garamond, Georgia, serif" font-size="21" font-weight="600" fill="#0f2247">Parse steps</text>
<text x="245.0" y="120" font-size="11" fill="#5b6b8c" letter-spacing="1.2">STUDENT.PY</text>
<text x="245.0" y="170" font-size="13" fill="#0f2247">sentences → numbered</text>
<text x="245.0" y="187" font-size="13" fill="#0f2247">claims + final answer</text>
<line x1="408.0" y1="145.0" x2="430.0" y2="145.0" stroke="#0f2247" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="432.0" y="70" width="175.0" height="150" rx="6" fill="#fff" stroke="#0f2247" stroke-width="1"/>
<text x="446.0" y="100" font-family="Cormorant Garamond, Georgia, serif" font-size="21" font-weight="600" fill="#0f2247">Formalize</text>
<text x="446.0" y="120" font-size="11" fill="#5b6b8c" letter-spacing="1.2">PREGROUP GRAMMAR</text>
<text x="446.0" y="134" font-size="11" fill="#5b6b8c" letter-spacing="1.2">→ FALCON-34B FALLBACK</text>
<text x="446.0" y="170" font-size="13" fill="#0f2247">each claim → Lean 4 Prop;</text>
<text x="446.0" y="187" font-size="13" fill="#0f2247">round-trip audit</text>
<line x1="609.0" y1="145.0" x2="631.0" y2="145.0" stroke="#0f2247" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="633.0" y="70" width="175.0" height="150" rx="6" fill="#f6f8fc" stroke="#0f2247" stroke-width="1.8"/>
<text x="647.0" y="100" font-family="Cormorant Garamond, Georgia, serif" font-size="21" font-weight="600" fill="#0f2247">Lean 4 kernel</text>
<text x="647.0" y="120" font-size="11" fill="#5b6b8c" letter-spacing="1.2">MATHLIB + FV_AUTO</text>
<text x="647.0" y="170" font-size="13" fill="#0f2247">prove P, prove ¬P,</text>
<text x="647.0" y="187" font-size="13" fill="#0f2247">or say unknown</text>
<line x1="810.0" y1="145.0" x2="832.0" y2="145.0" stroke="#0f2247" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="834.0" y="70" width="175.0" height="150" rx="6" fill="#fff" stroke="#0f2247" stroke-width="1"/>
<text x="848.0" y="100" font-family="Cormorant Garamond, Georgia, serif" font-size="21" font-weight="600" fill="#0f2247">Teach</text>
<text x="848.0" y="120" font-size="11" fill="#5b6b8c" letter-spacing="1.2">FEEDBACK.PY</text>
<text x="848.0" y="170" font-size="13" fill="#0f2247">refuted claim → plain-</text>
<text x="848.0" y="187" font-size="13" fill="#0f2247">language feedback</text>
<line x1="1011.0" y1="145.0" x2="1033.0" y2="145.0" stroke="#0f2247" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="1035.0" y="70" width="175.0" height="150" rx="6" fill="#fff" stroke="#0f2247" stroke-width="1"/>
<text x="1049.0" y="100" font-family="Cormorant Garamond, Georgia, serif" font-size="21" font-weight="600" fill="#0f2247">Assurance trace</text>
<text x="1049.0" y="120" font-size="11" fill="#5b6b8c" letter-spacing="1.2">RUNS/*.JSON</text>
<text x="1049.0" y="170" font-size="13" fill="#0f2247">every round, Prop,</text>
<text x="1049.0" y="187" font-size="13" fill="#0f2247">verdict, proof source</text>
<rect x="591.25" y="230" width="61.625" height="20" rx="10" fill="#fff" stroke="#1f8a4c"/>
<text x="622.0625" y="244" font-size="10.5" text-anchor="middle" fill="#1f8a4c">verified</text>
<rect x="656.875" y="230" width="61.625" height="20" rx="10" fill="#fff" stroke="#b3213a"/>
<text x="687.6875" y="244" font-size="10.5" text-anchor="middle" fill="#b3213a">refuted</text>
<rect x="722.5" y="230" width="61.625" height="20" rx="10" fill="#fff" stroke="#a8690b"/>
<text x="753.3125" y="244" font-size="10.5" text-anchor="middle" fill="#a8690b">unknown</text>
<rect x="788.125" y="230" width="61.625" height="20" rx="10" fill="#fff" stroke="#6b3fa0"/>
<text x="818.9375" y="244" font-size="10.5" text-anchor="middle" fill="#6b3fa0">ill-formed</text>
<path d="M921.5 222 V298 H117.5 V224" fill="none" stroke="#b3213a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="519.5" y="290" font-size="12.5" text-anchor="middle" fill="#b3213a">revision round (≤ 3): Falcon sees only natural-language feedback — it never sees Lean</text>
<rect x="231.0" y="338" width="577.0" height="64" rx="6" fill="#fff" stroke="#d9e0ee"/>
<line x1="720.5" y1="254" x2="720.5" y2="338" stroke="#5b6b8c" stroke-width="1" stroke-dasharray="3 3"/>
<text x="245.0" y="362" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-weight="600" fill="#0f2247">Memory (SQLite)</text>
<text x="421.0" y="362" font-size="12" fill="#5b6b8c">kernel verdicts and type-checked translations are reused under the same toolchain fingerprint</text>
<text x="421.0" y="382" font-size="12" fill="#5b6b8c">Falcon's answer is never reused — every run samples a fresh answer and is judged on it</text>
<text x="1210.0" y="354" font-size="13" text-anchor="end" font-family="Cormorant Garamond, Georgia, serif" font-weight="600" fill="#0f2247">Only a proof counts.</text>
<text x="1210.0" y="372" font-size="11.5" text-anchor="end" fill="#5b6b8c">No proof either way → “unknown”,</text>
<text x="1210.0" y="388" font-size="11.5" text-anchor="end" fill="#5b6b8c">never “probably right”.</text>
</svg>